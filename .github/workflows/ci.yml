# Continuous integration: every push and pull request runs lint, tests, coverage gates,
# a migration check, the production build, and a full Docker end-to-end run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:                     # a newer push cancels the older run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mealconnect
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mealconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mealconnect" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mealconnect:ci-password@localhost:5432/mealconnect_test
      TEST_DATABASE_URL: postgresql+psycopg://mealconnect:ci-password@localhost:5432/mealconnect_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and format check
        run: ruff check app tests && ruff format --check app tests
      - name: Tests with coverage gate (fails below 90 %)
        run: python -m pytest --cov --cov-report=term --cov-report=xml
      - name: Migrations are in sync with the models
        run: alembic upgrade head && alembic check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - name: Unit/component tests with coverage floor
        run: npx vitest run --coverage
      - run: npm run build

  docker-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway secrets for this run
        run: |
          for k in POSTGRES_PASSWORD JWT_SECRET_KEY PAYMENT_WEBHOOK_SECRET; do
            echo "$k=$(openssl rand -hex 24)" >> .env
          done
      - name: Build images and start the stack
        run: docker compose up -d --build --wait
      - name: Seed demo data
        run: docker compose run --rm -e ENVIRONMENT=development api python -m app.seed --reset
      - name: API flow (Postman collection via Newman)
        run: |
          npx --yes newman@6.2.3 run postman/MealConnect.postman_collection.json \
            -e postman/local.postman_environment.json --env-var baseUrl=http://localhost:8080/api/v1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser end-to-end tests (Playwright)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          docker compose run --rm -e ENVIRONMENT=development api python -m app.seed --reset
          E2E_BASE_URL=http://localhost:8080 npx playwright test
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
