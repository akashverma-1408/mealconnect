# Nginx: serves the built React app and reverse-proxies /api to FastAPI.
# The browser only ever talks to this one origin, so no CORS is needed.

upstream api {
    server api:8000;          # Docker Compose service name, resolved by Docker's DNS
    keepalive 16;             # reuse connections to the API
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;                 # don't advertise the Nginx version
    client_max_body_size 1m;           # the API only accepts small JSON bodies

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security headers for the web app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only our own code may run; Razorpay Checkout is the single allowed third party.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://*.razorpay.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- API ------------------------------------------------------------
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;   # same ID in Nginx and API logs
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Any add_header here stops inheritance of the server-level (web app) headers;
        # the API already sends its own security headers.
        add_header X-Served-By "api" always;
    }

    # Interactive API docs (only answered when API_DOCS_ENABLED is true).
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By "api" always;
    }

    # ---- Static assets: file names contain a content hash -> cache "forever" ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Liveness of the web container itself.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Single-page app: unknown paths serve index.html; React Router decides ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;   # always check for a new release
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://*.razorpay.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
