[project]
name = "mealconnect-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long assertion lines are clearer unwrapped

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP046", "UP047"]  # B008: FastAPI Depends() defaults; UP046/7: keep Generic[T] style
